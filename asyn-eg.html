<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        async function getAllUsers() {
            const result = await fetch('https://jsonplaceholder.typicode.com/users');
            const jsonresult = await result.json();
            const userEmail = jsonresult.map(user => {
                return user.email;
            })
           console.log(userEmail)
        }
        getAllUsers()

        async function getDadJoke() {
            const response = await fetch('https://icanhazdadjoke.com', {
                method: 'GET',
                headers: {
                    Accept: 'application/json'
                }
            })
            const responseResult = await response.json();
            console.log(responseResult);
        }
        getDadJoke();

        const jokeObject = {
            "id": "Qusrcahiib",
            "joke": "Astronomers got tired watching the moon go around the earth for 24 hours. They decided to call it a day.",
            "status": 200
        }
        async function postDadJoke(jokeObj) {
            const response = await fetch('https://httpbin.org/post', {
                method: 'POST',
                headers: {
                    "Content-type" : 'application/json'
                },
                body: JSON.stringify(jokeObj)
            });
            const jokeresponse = await response.json();
            console.log(jokeresponse);
        }
        postDadJoke(jokeObject);

         
    </script>
</body>
</html>
